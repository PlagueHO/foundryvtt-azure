name: lint-and-publish-bicep

on:
  workflow_call:

jobs:
  lint-and-publish-bicep:
    name: Lint and Publish Bicep
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    
    - name: Lint Bicep
      run: |
        bicep lint ./infra/main.bicep

    - name: Build Bicep
      run: bicep build ./infra/main.bicep

    - name: Test Web App routing and validation checks
      shell: pwsh
      run: |
        Import-Module Pester -MinimumVersion 5.0
        $result = Invoke-Pester -Path ./tests/Test-WebAppInfrastructure.Tests.ps1 -PassThru -Output Detailed
        if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) {
          throw 'Web App regression checks failed or no tests passed.'
        }

    - name: Publish Bicep as Workflow Artifact
      uses: actions/upload-artifact@v7
      with:
        name: infrastructure_bicep
        path: |
           ./infra/*.bicep
           ./infra/*.json
           ./infra/core/
           ./infra/types/
