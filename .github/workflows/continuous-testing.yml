name: continuous-testing
# Because this workflow only performs testing, and not deployment, it is called continuous-testing.
on:
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - infra/**
  workflow_dispatch:
    inputs:
      WEB_APP_ONLY:
        description: "Run only the two sequential Web App tests. Paid resources require separate approval."
        type: boolean
        default: false

concurrency:
  group: foundry-infrastructure-tests
  cancel-in-progress: false
  
permissions:
  id-token: write
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint-and-publish-bicep:
    uses: ./.github/workflows/lint-and-publish-bicep.yml

  # Only run test-infrastructure in series because only one Foundry environment can be deployed at a time
  test-webapp:
    name: Test WebApp Deployment with Networking
    uses: ./.github/workflows/test-infrastructure.yml
    needs:
      - lint-and-publish-bicep
    with:
      ENVIRONMENT: WebApp
      AZURE_ENV_NAME: ${{ format('fvtt-asp-on-{0}-{1}', github.run_id, github.run_attempt) }}
      AZURE_RESOURCE_GROUP_NAME: ${{ format('rg-fvtt-asp-on-{0}-{1}', github.run_id, github.run_attempt) }}
      AZURE_APP_SERVICE_PLAN_SKUNAME: 'P0v3'
      AZURE_COMPUTE_SERVICE: 'Web App'
      AZURE_DEPLOY_NETWORKING: ${{ 'true' }}
      AZURE_DEPLOY_DDB_PROXY: ${{ inputs.WEB_APP_ONLY && 'false' || '' }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
      FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
      FOUNDRY_ADMIN_KEY: ${{ secrets.FOUNDRY_ADMIN_KEY }}

  test-webapp-without-networking:
    name: Test WebApp Deployment without Networking
    if: ${{ always() && needs.test-webapp.outputs.CLEANUP_SUCCEEDED == 'true' }}
    uses: ./.github/workflows/test-infrastructure.yml
    needs:
      - test-webapp
    with:
      ENVIRONMENT: WebApp
      AZURE_ENV_NAME: ${{ format('fvtt-asp-off-{0}-{1}', github.run_id, github.run_attempt) }}
      AZURE_RESOURCE_GROUP_NAME: ${{ format('rg-fvtt-asp-off-{0}-{1}', github.run_id, github.run_attempt) }}
      AZURE_APP_SERVICE_PLAN_SKUNAME: 'P0v3'
      AZURE_COMPUTE_SERVICE: 'Web App'
      AZURE_DEPLOY_NETWORKING: ${{ 'false' }}
      AZURE_DEPLOY_DDB_PROXY: ${{ inputs.WEB_APP_ONLY && 'false' || '' }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
      FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
      FOUNDRY_ADMIN_KEY: ${{ secrets.FOUNDRY_ADMIN_KEY }}

  # Only run test-infrastructure in series because only one Foundry environment can be deployed at a time
  test-container-app:
    name: Test Container App Deployment
    if: ${{ !inputs.WEB_APP_ONLY }}
    uses: ./.github/workflows/test-infrastructure.yml
    needs:
      - test-webapp-without-networking
    with:
      ENVIRONMENT: ContainerApp
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_ENV_NAME: ${{ format('fvtt-aca-{0}-{1}', github.ref_name, github.run_id) }}
      AZURE_RESOURCE_GROUP_NAME: ${{ format('rg-fvtt-aca-{0}-{1}', github.ref_name, github.run_id) }}
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
      FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
      FOUNDRY_ADMIN_KEY: ${{ secrets.FOUNDRY_ADMIN_KEY }}

  # Only run test-infrastructure in series because only one Foundry environment can be deployed at a time
  test-container-instance:
    name: Test Container Instance Deployment
    uses: ./.github/workflows/test-infrastructure.yml
    needs:
      - test-container-app
    with:
      ENVIRONMENT: ContainerInstance
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_ENV_NAME: ${{ format('fvtt-aci-{0}-{1}', github.ref_name, github.run_id) }}
      AZURE_RESOURCE_GROUP_NAME: ${{ format('rg-fvtt-aci-{0}-{1}', github.ref_name, github.run_id) }}
      # This deployment can fail with '(403) Forbidden.' when tenant policy blocks storage accounts with public endpoints.
      ALLOW_STORAGE_POLICY_403_FORBIDDEN: true
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
      FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
      FOUNDRY_ADMIN_KEY: ${{ secrets.FOUNDRY_ADMIN_KEY }}
