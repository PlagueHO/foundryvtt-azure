name: test-infrastructure

on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        description: "The environment to validate the application infrastructure for"
        required: true
        type: string
      AZURE_LOCATION:
        description: "The Azure region to deploy the application resources to. If not provided, falls back to the AZURE_LOCATION environment variable in the target environment."
        required: false
        type: string
      AZURE_ENV_NAME:
        description: "The name of the Azure environment"
        required: true
        type: string
      AZURE_RESOURCE_GROUP_NAME:
        description: "The name of the Azure resource group to deploy the application resources to"
        required: false
        type: string
      AZURE_RESOURCE_GROUP_TAGS:
        description: "JSON tags for this test group. Empty uses TEST_RESOURCE_GROUP_TAGS in the WebApp environment only; '{}' disables it."
        required: false
        type: string
      ISOLATED_WEBAPP_TEST:
        description: "Disable optional services and storage locks for an approved isolated Web App test, and verify group deletion."
        required: false
        type: boolean
        default: false
      AZURE_APP_SERVICE_PLAN_SKUNAME:
        description: "The App Service Plan SKU name to use for the Web App compute service"
        required: false
        type: string
        default: 'P0v3'
      AZURE_COMPUTE_SERVICE:
        description: "Override the compute service for an isolated test. Otherwise use the environment variable."
        required: false
        type: string
      AZURE_DEPLOY_NETWORKING:
        description: "Override networking with 'true' or 'false' for an isolated test. Otherwise use the environment variable."
        required: false
        type: string
      ALLOW_STORAGE_POLICY_403_FORBIDDEN:
        description: "When true, treats azd provision failures containing '(403) Forbidden' as non-fatal."
        required: false
        type: boolean
        default: false

    secrets:
      AZURE_TENANT_ID:
        description: "The Azure tenant ID to use for authentication to Azure for deployment"
        required: true
      AZURE_SUBSCRIPTION_ID:
        description: "The Azure subscription ID to use for authentication to Azure for deployment"
        required: true
      AZURE_CLIENT_ID:
        description: "The Azure client ID to use for authentication to Azure for deployment"
        required: true
      FOUNDRY_USERNAME:
        description: "The Foundry username to use to download the Foundry VTT licence"
        required: true
      FOUNDRY_PASSWORD:
        description: "The Foundry password to use to download the Foundry VTT licence"
        required: true
      FOUNDRY_ADMIN_KEY:
        description: "The Foundry admin key to use for authentication to Foundry"
        required: true

jobs:
  test-infrastructure:
    name: Test ${{ inputs.ENVIRONMENT }} Infrastructure
    timeout-minutes: 120
    env:
      # Required for azd to authenticate with Azure using Federated Credentials
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Required for azd to provision the infrastructure
      AZURE_ENV_NAME: ${{ inputs.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ inputs.AZURE_LOCATION || vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP_NAME: ${{ inputs.AZURE_RESOURCE_GROUP_NAME || format('rg-{0}', inputs.AZURE_ENV_NAME) }}
      AZURE_RESOURCE_GROUP_TAGS: ${{ inputs.AZURE_RESOURCE_GROUP_TAGS || '{}' }}

      # Optional azd parameters when using Federated Credentials
      AZURE_PRINCIPAL_ID_TYPE: 'ServicePrincipal'

      # Foundry secrets as environment variables
      FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
      FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
      FOUNDRY_ADMIN_KEY: ${{ secrets.FOUNDRY_ADMIN_KEY }}

      # Environment variables for azd
      AZURE_APP_SERVICE_PLAN_SKUNAME: ${{ inputs.AZURE_APP_SERVICE_PLAN_SKUNAME }}
      AZURE_COMPUTE_SERVICE: ${{ inputs.AZURE_COMPUTE_SERVICE || vars.AZURE_COMPUTE_SERVICE }}
      AZURE_DEPLOY_DDB_PROXY: ${{ inputs.ISOLATED_WEBAPP_TEST && 'false' || vars.AZURE_DEPLOY_DDB_PROXY }}
      AZURE_BASTION_HOST_DEPLOY: 'false'
      AZURE_DEPLOY_DIAGNOSTICS: ${{ inputs.ISOLATED_WEBAPP_TEST && 'false' || vars.AZURE_DEPLOY_DIAGNOSTICS }}
      AZURE_DEPLOY_NETWORKING: ${{ inputs.AZURE_DEPLOY_NETWORKING || vars.AZURE_DEPLOY_NETWORKING }}
      AZURE_STORAGE_RESOURCE_LOCK_ENABLED: ${{ inputs.ISOLATED_WEBAPP_TEST && 'false' || vars.AZURE_STORAGE_RESOURCE_LOCK_ENABLED }}
      AZURE_STORAGE_CONFIGURATION: 'Premium_100GB'
      AZURE_CONTAINER_INSTANCE_CPU: ${{ vars.AZURE_CONTAINER_INSTANCE_CPU || '2' }}
      AZURE_CONTAINER_INSTANCE_MEMORY_IN_GB: ${{ vars.AZURE_CONTAINER_INSTANCE_MEMORY_IN_GB }}
      AZURE_CONTAINER_APP_MIN_REPLICAS: ${{ vars.AZURE_CONTAINER_APP_MIN_REPLICAS || '0' }}
      AZURE_STORAGE_PUBLIC_ACCESS: ${{ inputs.ISOLATED_WEBAPP_TEST && 'false' || vars.AZURE_STORAGE_PUBLIC_ACCESS }}

    environment: ${{ inputs.ENVIRONMENT }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate isolated Web App scope
        if: env.AZURE_COMPUTE_SERVICE == 'Web App' || inputs.ISOLATED_WEBAPP_TEST || env.AZURE_RESOURCE_GROUP_TAGS != '{}'
        shell: pwsh
        env:
          REQUESTED_TEST_RESOURCE_GROUP_TAGS: ${{ inputs.AZURE_RESOURCE_GROUP_TAGS }}
          CONFIGURED_TEST_RESOURCE_GROUP_TAGS: ${{ inputs.ENVIRONMENT == 'WebApp' && vars.TEST_RESOURCE_GROUP_TAGS || '{}' }}
        run: |
          $expectedSuffix = "-$Env:GITHUB_RUN_ID-$Env:GITHUB_RUN_ATTEMPT"
          $allowedNames = @("fvtt-asp-on$expectedSuffix", "fvtt-asp-off$expectedSuffix")
          if ($Env:AZURE_COMPUTE_SERVICE -ne 'Web App' -or
              $Env:AZURE_ENV_NAME -cnotin $allowedNames -or
              $Env:AZURE_RESOURCE_GROUP_NAME -cne "rg-$Env:AZURE_ENV_NAME") {
            throw 'Isolated Web App tests require the unique Web App and resource group names for this workflow run.'
          }
          $testTagJson = if ([string]::IsNullOrEmpty($Env:REQUESTED_TEST_RESOURCE_GROUP_TAGS)) {
            $Env:CONFIGURED_TEST_RESOURCE_GROUP_TAGS
          } else {
            $Env:REQUESTED_TEST_RESOURCE_GROUP_TAGS
          }
          $testTags = ConvertFrom-Json -InputObject $testTagJson -AsHashtable -NoEnumerate -ErrorAction Stop
          if ($testTags -isnot [System.Collections.IDictionary]) {
            throw 'Web App test resource group tags must be a JSON object.'
          }
          "AZURE_RESOURCE_GROUP_TAGS=$($testTags | ConvertTo-Json -Compress -Depth 20)" |
            Add-Content -LiteralPath $Env:GITHUB_ENV

      - name: Install azd
        uses: Azure/setup-azd@v2.4.0

      - name: Record azd version
        shell: pwsh
        run: azd version

      - name: Authenticate azd (Federated Credentials)
        run: |
          azd auth login `
            --client-id "$Env:AZURE_CLIENT_ID" `
            --federated-credential-provider "github" `
            --tenant-id "$Env:AZURE_TENANT_ID"
        shell: pwsh

      - name: Validate exact test target
        id: test_scope
        shell: pwsh
        run: |
          ./scripts/Remove-TestInfrastructure.ps1 `
            -SubscriptionId $Env:AZURE_SUBSCRIPTION_ID -TenantId $Env:AZURE_TENANT_ID `
            -EnvironmentName $Env:AZURE_ENV_NAME -ResourceGroupName $Env:AZURE_RESOURCE_GROUP_NAME `
            -ComputeService $Env:AZURE_COMPUTE_SERVICE `
            -RunId $Env:GITHUB_RUN_ID -RunAttempt $Env:GITHUB_RUN_ATTEMPT -ValidateOnly

      - name: Provision Infrastructure
        timeout-minutes: ${{ env.AZURE_COMPUTE_SERVICE == 'Container App' && 40 || 20 }}
        shell: pwsh
        run: |
          # Stream output to logs while also capturing it for targeted failure handling.
          & azd provision --no-prompt 2>&1 | Tee-Object -Variable provisionOutput
          $provisionExitCode = $LASTEXITCODE
          $provisionText = $provisionOutput | Out-String

          if ($provisionExitCode -ne 0) {
            $allow403Forbidden = '${{ inputs.ALLOW_STORAGE_POLICY_403_FORBIDDEN }}' -eq 'true'
            $containsForbidden = $provisionText -match '\(403\) Forbidden\.'

            if ($allow403Forbidden -and $containsForbidden) {
              Write-Warning "azd provision failed with '(403) Forbidden.' Continuing because this is most likely caused by a policy preventing storage accounts with public endpoints."
            } else {
              Write-Error "azd provision failed with exit code $provisionExitCode. See provision output above."
              exit $provisionExitCode
            }
          }
          
      - name: Check Web App routing, references, and HTTP readiness
        if: env.AZURE_COMPUTE_SERVICE == 'Web App'
        timeout-minutes: 40
        shell: pwsh
        run: |
          $storageAccountName = $Env:AZURE_ENV_NAME.Replace('-', '').ToLowerInvariant()
          $storageAccountName = $storageAccountName.Substring(0, [Math]::Min(24, $storageAccountName.Length))
          $networking = if ($Env:AZURE_DEPLOY_NETWORKING -eq 'true') { 'Enabled' } else { 'Disabled' }
          $resourceGroupName = & azd env get-value AZURE_RESOURCE_GROUP_NAME
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($resourceGroupName)) {
            throw 'Cannot read the provisioned test resource group name from azd.'
          }
          $result = & ./scripts/Test-WebAppInfrastructure.ps1 `
            -SubscriptionId $Env:AZURE_SUBSCRIPTION_ID `
            -TenantId $Env:AZURE_TENANT_ID `
            -ResourceGroupName $resourceGroupName `
            -WebAppName $Env:AZURE_ENV_NAME `
            -StorageAccountName $storageAccountName `
            -Networking $networking `
            -CaptureRuntimeMount:('${{ inputs.ISOLATED_WEBAPP_TEST }}' -eq 'true')
          "Web App routing, Key Vault references, storage configuration, and Foundry HTTP readiness: passed." |
            Add-Content -Path $Env:GITHUB_STEP_SUMMARY
          if ($result.RuntimeMountEvidence) {
            $result.RuntimeMountEvidence | ConvertTo-Json |
              Set-Content -LiteralPath (Join-Path $Env:RUNNER_TEMP 'webapp-mount-evidence.json')
            "Runtime /data CIFS mount: verified in the application container." |
              Add-Content -Path $Env:GITHUB_STEP_SUMMARY
          } elseif (-not $result.RuntimeMountVerified) {
            "Runtime /data mount verification: BLOCKED. Application-container mountinfo evidence is still required before accepting the fix." |
              Add-Content -Path $Env:GITHUB_STEP_SUMMARY
          }

      - name: Save application-container mount evidence
        if: inputs.ISOLATED_WEBAPP_TEST
        uses: actions/upload-artifact@v7
        with:
          name: mount-evidence-${{ env.AZURE_ENV_NAME }}
          path: ${{ runner.temp }}/webapp-mount-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Inspect and stop active test deployments
        id: cleanup_scope
        if: always() && steps.test_scope.outcome == 'success'
        timeout-minutes: 5
        shell: pwsh
        run: |
          ./scripts/Remove-TestInfrastructure.ps1 `
            -SubscriptionId $Env:AZURE_SUBSCRIPTION_ID -TenantId $Env:AZURE_TENANT_ID `
            -EnvironmentName $Env:AZURE_ENV_NAME -ResourceGroupName $Env:AZURE_RESOURCE_GROUP_NAME `
            -ComputeService $Env:AZURE_COMPUTE_SERVICE `
            -RunId $Env:GITHUB_RUN_ID -RunAttempt $Env:GITHUB_RUN_ATTEMPT `
            -StopDeploymentsOnly -TimeoutSeconds 240 -Confirm:$false `
            -EvidencePath (Join-Path $Env:RUNNER_TEMP 'test-cleanup-evidence.json')

      - name: Delete Infrastructure
        if: always() && steps.test_scope.outcome == 'success' && steps.cleanup_scope.outputs.scope_validated == 'true'
        timeout-minutes: 10
        shell: pwsh
        run: azd down --environment "$Env:AZURE_ENV_NAME" --no-prompt --purge --force

      - name: Verify test group deletion and remove remaining resources
        if: always() && steps.test_scope.outcome == 'success'
        timeout-minutes: 20
        shell: pwsh
        run: |
          ./scripts/Remove-TestInfrastructure.ps1 `
            -SubscriptionId $Env:AZURE_SUBSCRIPTION_ID -TenantId $Env:AZURE_TENANT_ID `
            -EnvironmentName $Env:AZURE_ENV_NAME -ResourceGroupName $Env:AZURE_RESOURCE_GROUP_NAME `
            -ComputeService $Env:AZURE_COMPUTE_SERVICE `
            -RunId $Env:GITHUB_RUN_ID -RunAttempt $Env:GITHUB_RUN_ATTEMPT -Confirm:$false `
            -EvidencePath (Join-Path $Env:RUNNER_TEMP 'test-cleanup-evidence.json')
