name: test-infrastructure

on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        description: "The environment to validate the application infrastructure for"
        required: true
        type: string
      AZURE_LOCATION:
        description: "The Azure region to deploy the application resources to. If not provided, falls back to the AZURE_LOCATION environment variable in the target environment."
        required: false
        type: string
      AZURE_ENV_NAME:
        description: "The name of the Azure environment"
        required: true
        type: string
      AZURE_RESOURCE_GROUP_NAME:
        description: "The name of the Azure resource group to deploy the application resources to"
        required: false
        type: string
      AZURE_APP_SERVICE_PLAN_SKUNAME:
        description: "The App Service Plan SKU name to use for the Web App compute service"
        required: false
        type: string
        default: 'P0v3'
      AZURE_COMPUTE_SERVICE:
        description: "Override the compute service for an isolated test. Otherwise use the environment variable."
        required: false
        type: string
      AZURE_DEPLOY_NETWORKING:
        description: "Override networking with 'true' or 'false' for an isolated test. Otherwise use the environment variable."
        required: false
        type: string
      AZURE_DEPLOY_DDB_PROXY:
        description: "Override the optional proxy with 'true' or 'false'. Otherwise use the environment variable."
        required: false
        type: string
      DIAGNOSTICS_ONLY:
        description: "Read existing isolated Web App test logs without deploying or deleting resources."
        type: boolean
        default: false
      CAPTURE_MOUNT_EVIDENCE:
        description: "Add a Node mount probe and refresh references in an existing isolated test app only."
        type: boolean
        default: false
      ALLOW_STORAGE_POLICY_403_FORBIDDEN:
        description: "When true, treats azd provision failures containing '(403) Forbidden' as non-fatal."
        required: false
        type: boolean
        default: false

    outputs:
      CLEANUP_SUCCEEDED:
        description: "Whether the isolated test resources were deleted successfully."
        value: ${{ jobs.test-infrastructure.outputs.CLEANUP_SUCCEEDED }}

    secrets:
      AZURE_TENANT_ID:
        description: "The Azure tenant ID to use for authentication to Azure for deployment"
        required: true
      AZURE_SUBSCRIPTION_ID:
        description: "The Azure subscription ID to use for authentication to Azure for deployment"
        required: true
      AZURE_CLIENT_ID:
        description: "The Azure client ID to use for authentication to Azure for deployment"
        required: true
      FOUNDRY_USERNAME:
        description: "The Foundry username to use to download the Foundry VTT licence"
        required: true
      FOUNDRY_PASSWORD:
        description: "The Foundry password to use to download the Foundry VTT licence"
        required: true
      FOUNDRY_ADMIN_KEY:
        description: "The Foundry admin key to use for authentication to Foundry"
        required: true

jobs:
  test-infrastructure:
    name: Test ${{ inputs.ENVIRONMENT }} Infrastructure
    timeout-minutes: 90
    outputs:
      CLEANUP_SUCCEEDED: ${{ steps.cleanup.outcome == 'success' }}
    env:
      # Required for azd to authenticate with Azure using Federated Credentials
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Required for azd to provision the infrastructure
      AZURE_ENV_NAME: ${{ inputs.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ inputs.AZURE_LOCATION || vars.AZURE_LOCATION }}
      AZURE_RESOURCE_GROUP_NAME: ${{ inputs.AZURE_RESOURCE_GROUP_NAME }}

      # Optional azd parameters when using Federated Credentials
      AZURE_PRINCIPAL_ID_TYPE: 'ServicePrincipal'

      # Foundry secrets as environment variables
      FOUNDRY_USERNAME: ${{ secrets.FOUNDRY_USERNAME }}
      FOUNDRY_PASSWORD: ${{ secrets.FOUNDRY_PASSWORD }}
      FOUNDRY_ADMIN_KEY: ${{ secrets.FOUNDRY_ADMIN_KEY }}

      # Environment variables for azd
      AZURE_APP_SERVICE_PLAN_SKUNAME: ${{ inputs.AZURE_APP_SERVICE_PLAN_SKUNAME }}
      AZURE_COMPUTE_SERVICE: ${{ inputs.AZURE_COMPUTE_SERVICE || vars.AZURE_COMPUTE_SERVICE }}
      AZURE_DEPLOY_DDB_PROXY: ${{ inputs.AZURE_DEPLOY_DDB_PROXY || vars.AZURE_DEPLOY_DDB_PROXY }}
      AZURE_DEPLOY_DIAGNOSTICS: ${{ vars.AZURE_DEPLOY_DIAGNOSTICS }}
      AZURE_DEPLOY_NETWORKING: ${{ inputs.AZURE_DEPLOY_NETWORKING || vars.AZURE_DEPLOY_NETWORKING }}
      AZURE_STORAGE_RESOURCE_LOCK_ENABLED: ${{ vars.AZURE_STORAGE_RESOURCE_LOCK_ENABLED }}
      AZURE_CONTAINER_INSTANCE_CPU: ${{ vars.AZURE_CONTAINER_INSTANCE_CPU || '2' }}
      AZURE_CONTAINER_INSTANCE_MEMORY_IN_GB: ${{ vars.AZURE_CONTAINER_INSTANCE_MEMORY_IN_GB }}
      AZURE_CONTAINER_APP_MIN_REPLICAS: ${{ vars.AZURE_CONTAINER_APP_MIN_REPLICAS || '0' }}
      AZURE_STORAGE_PUBLIC_ACCESS: ${{ vars.AZURE_STORAGE_PUBLIC_ACCESS }}

    environment: ${{ inputs.ENVIRONMENT }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install azd
        uses: Azure/setup-azd@v2.4.0

      - name: Authenticate azd (Federated Credentials)
        run: |
          azd auth login `
            --client-id "$Env:AZURE_CLIENT_ID" `
            --federated-credential-provider "github" `
            --tenant-id "$Env:AZURE_TENANT_ID"
        shell: pwsh

      - name: Provision Infrastructure
        if: ${{ !inputs.DIAGNOSTICS_ONLY }}
        id: provision
        timeout-minutes: 20
        shell: pwsh
        run: |
          # Stream output to logs while also capturing it for targeted failure handling.
          & azd provision --no-prompt 2>&1 | Tee-Object -Variable provisionOutput
          $provisionExitCode = $LASTEXITCODE
          $provisionText = $provisionOutput | Out-String

          if ($provisionExitCode -ne 0) {
            $allow403Forbidden = '${{ inputs.ALLOW_STORAGE_POLICY_403_FORBIDDEN }}' -eq 'true'
            $containsForbidden = $provisionText -match '\(403\) Forbidden\.'

            if ($allow403Forbidden -and $containsForbidden) {
              Write-Warning "azd provision failed with '(403) Forbidden.' Continuing because this is most likely caused by a policy preventing storage accounts with public endpoints."
            } else {
              Write-Error "azd provision failed with exit code $provisionExitCode. See provision output above."
              exit $provisionExitCode
            }
          }
          
      - name: Check Web App routing, references, and HTTP readiness
        if: ${{ !inputs.DIAGNOSTICS_ONLY && env.AZURE_COMPUTE_SERVICE == 'Web App' }}
        timeout-minutes: 40
        shell: pwsh
        run: |
          $storageAccountName = $Env:AZURE_ENV_NAME.Replace('-', '').ToLowerInvariant()
          $storageAccountName = $storageAccountName.Substring(0, [Math]::Min(24, $storageAccountName.Length))
          $networking = if ($Env:AZURE_DEPLOY_NETWORKING -eq 'true') { 'Enabled' } else { 'Disabled' }
          $resourceGroupName = & azd env get-value AZURE_RESOURCE_GROUP_NAME
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($resourceGroupName)) {
            throw 'Cannot read the provisioned test resource group name from azd.'
          }
          $result = & ./scripts/Test-WebAppInfrastructure.ps1 `
            -SubscriptionId $Env:AZURE_SUBSCRIPTION_ID `
            -TenantId $Env:AZURE_TENANT_ID `
            -ResourceGroupName $resourceGroupName `
            -WebAppName $Env:AZURE_ENV_NAME `
            -StorageAccountName $storageAccountName `
            -Networking $networking
          "Web App routing, Key Vault references, storage configuration, and Foundry HTTP readiness: passed." |
            Add-Content -Path $Env:GITHUB_STEP_SUMMARY
          if (-not $result.RuntimeMountVerified) {
            "Runtime /data mount verification: BLOCKED. Application-container mountinfo evidence is still required before accepting the fix." |
              Add-Content -Path $Env:GITHUB_STEP_SUMMARY
          }

      - name: Report Web App container diagnostic categories
        if: ${{ always() && (steps.provision.outcome == 'success' || inputs.DIAGNOSTICS_ONLY) && env.AZURE_COMPUTE_SERVICE == 'Web App' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $token = & azd auth token --tenant-id $Env:AZURE_TENANT_ID --scope 'https://management.azure.com/.default' --no-prompt
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($token)) {
              throw 'Cannot obtain a token for test container diagnostics.'
            }
            if ('${{ inputs.DIAGNOSTICS_ONLY }}' -eq 'true') {
              if ($Env:AZURE_ENV_NAME -notmatch '^fvtt-asp-(on|off)-\d+-\d+$' -or
                  $Env:AZURE_RESOURCE_GROUP_NAME -ne "rg-$Env:AZURE_ENV_NAME") {
                throw 'Diagnostics-only access is limited to isolated Web App test names.'
              }
              $resourceGroupName = $Env:AZURE_RESOURCE_GROUP_NAME
            } else {
              $resourceGroupName = & azd env get-value AZURE_RESOURCE_GROUP_NAME
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($resourceGroupName)) {
                throw 'Cannot read the isolated test resource group.'
              }
            }
            $headers = @{ Authorization = "Bearer $token" }
            $appUri = "https://management.azure.com/subscriptions/$Env:AZURE_SUBSCRIPTION_ID/resourceGroups/$resourceGroupName/providers/Microsoft.Web/sites/$Env:AZURE_ENV_NAME"
            foreach ($referenceName in @('FOUNDRY_USERNAME', 'FOUNDRY_PASSWORD', 'FOUNDRY_ADMIN_KEY', 'STORAGE_ACCOUNT_KEY')) {
              $referenceStatus = Invoke-RestMethod -Uri "$appUri/config/configreferences/appsettings/$referenceName`?api-version=2025-03-01" -Headers $headers -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5
              "Key Vault reference $referenceName status: $($referenceStatus.properties.status)." |
                Tee-Object -FilePath $Env:GITHUB_STEP_SUMMARY -Append
            }
            $appIdentity = Invoke-RestMethod -Uri "$appUri`?api-version=2025-03-01" -Headers $headers -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5
            $vaultName = ('kv' + $Env:AZURE_ENV_NAME.Replace('-', ''))
            $vaultName = $vaultName.Substring(0, [Math]::Min(24, $vaultName.Length))
            $vaultUri = "https://management.azure.com/subscriptions/$Env:AZURE_SUBSCRIPTION_ID/resourceGroups/$resourceGroupName/providers/Microsoft.KeyVault/vaults/$vaultName"
            $vault = Invoke-RestMethod -Uri "$vaultUri`?api-version=2026-02-01" -Headers $headers -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5
            $roles = Invoke-RestMethod -Uri "$vaultUri/providers/Microsoft.Authorization/roleAssignments?api-version=2022-04-01" -Headers $headers -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5
            $hasSecretsRole = @($roles.value | Where-Object {
              $_.properties.principalId -eq $appIdentity.identity.principalId -and
              $_.properties.roleDefinitionId -like '*/4633458b-17de-408a-b874-0445c86b69e6'
            }).Count -gt 0
            "Key Vault access: publicNetworkAccess=$($vault.properties.publicNetworkAccess); defaultAction=$($vault.properties.networkAcls.defaultAction); enableRbacAuthorization=$($vault.properties.enableRbacAuthorization); appSecretsUserRole=$hasSecretsRole." |
              Tee-Object -FilePath $Env:GITHUB_STEP_SUMMARY -Append
            if ('${{ inputs.CAPTURE_MOUNT_EVIDENCE }}' -eq 'true') {
              if ('${{ inputs.DIAGNOSTICS_ONLY }}' -ne 'true') {
                throw 'Mount evidence capture requires the existing isolated test diagnostics mode.'
              }
              $settings = Invoke-RestMethod -Method Post -Uri "$appUri/config/appsettings/list?api-version=2025-03-01" -Headers $headers -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5
              $probe = 'import{readFileSync}from"node:fs";const m=readFileSync("/proc/self/mountinfo","utf8").split("\n").filter(x=>x.split(" ")[4]==="/data").join("\n").replace(/(?:password|pass|key|secret)=[^,\s]*/gi,"[redacted]");console.error("FVTT_MOUNTINFO:"+Buffer.from(m).toString("base64"));'
              $nodeOptions = '--import=data:text/javascript;base64,' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($probe))
              if ($settings.properties.PSObject.Properties.Name -contains 'NODE_OPTIONS') {
                if ($settings.properties.NODE_OPTIONS -ne $nodeOptions) {
                  throw 'The test app has different NODE_OPTIONS. Refusing to replace it.'
                }
              } else {
                $settings.properties | Add-Member -NotePropertyName NODE_OPTIONS -NotePropertyValue $nodeOptions
                $body = @{ properties = $settings.properties } | ConvertTo-Json -Depth 10
                Invoke-RestMethod -Method Put -Uri "$appUri/config/appsettings?api-version=2025-03-01" -Headers $headers -ContentType 'application/json' -Body $body -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5 | Out-Null
                Invoke-RestMethod -Method Post -Uri "$appUri/config/configreferences/appsettings/refresh?api-version=2025-03-01" -Headers $headers -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5 | Out-Null
              }
              $storageAccountName = $Env:AZURE_ENV_NAME.Replace('-', '').ToLowerInvariant()
              $storageAccountName = $storageAccountName.Substring(0, [Math]::Min(24, $storageAccountName.Length))
              for ($attempt = 1; $attempt -le 10; $attempt++) {
                $reference = Invoke-RestMethod -Uri "$appUri/config/configreferences/appsettings/STORAGE_ACCOUNT_KEY?api-version=2025-03-01" -Headers $headers -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5
                if ($reference.properties.status -eq 'Resolved') { break }
                Write-Information "Storage key reference status: $($reference.properties.status)." -InformationAction Continue
                Start-Sleep -Seconds 15
              }
              if ($reference.properties.status -ne 'Resolved') {
                throw "The storage key reference is not resolved (status: $($reference.properties.status)). Refusing to reapply the test mount."
              }
              $mountBody = @{
                properties = @{
                  foundrydata = @{
                    accessKey = '@AppSettingRef(STORAGE_ACCOUNT_KEY)'
                    accountName = $storageAccountName
                    protocol = 'Smb'
                    mountPath = '/data'
                    shareName = 'foundryvttdata'
                    type = 'AzureFiles'
                  }
                }
              } | ConvertTo-Json -Depth 5
              Invoke-RestMethod -Method Put -Uri "$appUri/config/azurestorageaccounts?api-version=2025-03-01" -Headers $headers -ContentType 'application/json' -Body $mountBody -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5 | Out-Null
              'Reapplied the unchanged test mount after its Key Vault reference resolved.' |
                Add-Content -Path $Env:GITHUB_STEP_SUMMARY
              $mountInfoPath = Join-Path $Env:RUNNER_TEMP "$Env:AZURE_ENV_NAME-mountinfo.txt"
              for ($attempt = 1; $attempt -le 12; $attempt++) {
                $probeLogs = Invoke-RestMethod -Method Post -Uri "$appUri/containerlogs?api-version=2025-03-01" -Headers $headers -TimeoutSec 30 -MaximumRetryCount 3 -RetryIntervalSec 5
                $evidence = [regex]::Matches([string]$probeLogs, 'FVTT_MOUNTINFO:([A-Za-z0-9+/=]+)')
                if ($evidence.Count -gt 0) {
                  [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($evidence[-1].Groups[1].Value)) |
                    Set-Content -LiteralPath $mountInfoPath
                  break
                }
                Start-Sleep -Seconds 15
              }
              if (-not (Test-Path -LiteralPath $mountInfoPath)) {
                $logZipPath = Join-Path $Env:RUNNER_TEMP "$Env:AZURE_ENV_NAME-containerlogs.zip"
                Invoke-WebRequest -Method Post -Uri "$appUri/containerlogs/zip/download?api-version=2025-03-01" -Headers $headers -OutFile $logZipPath -TimeoutSec 60 -MaximumRetryCount 3 -RetryIntervalSec 5
                $archive = [IO.Compression.ZipFile]::OpenRead($logZipPath)
                try {
                  foreach ($entry in $archive.Entries) {
                    if ($entry.Name -notlike '*.log') { continue }
                    $reader = [IO.StreamReader]::new($entry.Open())
                    try {
                      $entryLogs = $reader.ReadToEnd()
                      $evidence = [regex]::Matches($entryLogs, 'FVTT_MOUNTINFO:([A-Za-z0-9+/=]+)')
                      if ($evidence.Count -gt 0) {
                        [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($evidence[-1].Groups[1].Value)) |
                          Set-Content -LiteralPath $mountInfoPath
                        break
                      }
                    } finally {
                      $reader.Dispose()
                    }
                  }
                } finally {
                  $archive.Dispose()
                }
              }
              $networking = if ($Env:AZURE_ENV_NAME -match '^fvtt-asp-on-') { 'Enabled' } else { 'Disabled' }
            }
            $logs = Invoke-RestMethod -Method Post -Uri "$appUri/containerlogs?api-version=2025-03-01" -Headers $headers -TimeoutSec 60 -MaximumRetryCount 3 -RetryIntervalSec 5
            if ([string]::IsNullOrWhiteSpace($logs)) {
              throw 'The container log endpoint returned no diagnostic content.'
            }
            $categories = [ordered]@{
              'Azure Files mount failure' = 'BYOSFailure|failed to mount|mount error|permission denied'
              'Container image pull failure' = 'ImagePullFailure|failed to pull|unauthorized: authentication required'
              'Authentication failure signal' = 'Authentication failed|Unable to authenticate'
              'Foundry download failure' = 'Unable to proceed with installation|Download from presigned URL failed'
              'Container startup failure' = 'ContainerStartFailure|did not respond to HTTP pings|container has exited'
              'Foundry launcher started' = 'Starting launcher'
            }
            foreach ($category in $categories.GetEnumerator()) {
              "$($category.Key): $([bool]($logs -match $category.Value))" |
                Tee-Object -FilePath $Env:GITHUB_STEP_SUMMARY -Append
            }
            'Only fixed diagnostic categories were reported. Raw container logs were not printed.' |
              Add-Content -Path $Env:GITHUB_STEP_SUMMARY
            $failureTokens = [regex]::Matches([string]$logs, '(?i)mount error\(\d+\)|STATUS_[A-Z_]+|BYOSFailure|cifs_mount failed w/return code = -?\d+|AppSettingRef|KeyVaultReference|Authentication failed|invalid argument|permission denied') |
              ForEach-Object Value | Sort-Object -Unique
            "Recognized failure tokens: $($failureTokens -join ', ')" |
              Tee-Object -FilePath $Env:GITHUB_STEP_SUMMARY -Append
            if ('${{ inputs.CAPTURE_MOUNT_EVIDENCE }}' -eq 'true') {
              if (-not (Test-Path -LiteralPath $mountInfoPath)) {
                throw 'No application-container mount evidence was found in the log tail or archive.'
              }
              & ./scripts/Test-WebAppInfrastructure.ps1 -SubscriptionId $Env:AZURE_SUBSCRIPTION_ID `
                -TenantId $Env:AZURE_TENANT_ID -ResourceGroupName $resourceGroupName `
                -WebAppName $Env:AZURE_ENV_NAME -StorageAccountName $storageAccountName `
                -Networking $networking -MountInfoPath $mountInfoPath -RetryCount 2 -RetryIntervalSeconds 5 |
                Format-List
            }
          } finally {
            Remove-Variable -Name token, headers, logs, settings, body, probeLogs, entryLogs, reference -Force -ErrorAction SilentlyContinue
            if ($logZipPath -and (Test-Path -LiteralPath $logZipPath)) {
              Remove-Item -LiteralPath $logZipPath -Force
            }
          }

      - name: Preserve application-container mount evidence
        if: ${{ always() && inputs.DIAGNOSTICS_ONLY && inputs.CAPTURE_MOUNT_EVIDENCE }}
        uses: actions/upload-artifact@v7
        with:
          name: webapp-runtime-mount-${{ env.AZURE_ENV_NAME }}
          path: ${{ runner.temp }}/${{ env.AZURE_ENV_NAME }}-mountinfo.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Delete Infrastructure
        id: cleanup
        if: ${{ always() && !inputs.DIAGNOSTICS_ONLY }}
        timeout-minutes: 15
        run: azd down --no-prompt --purge --force
