name: recover-production-compute

on:
  workflow_call:
    inputs:
      MANIFEST_BASE64:
        description: "Approved recovery manifest with a verified snapshot and registered cleanup."
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        description: "Production workload identity client ID."
        required: true
      AZURE_TENANT_ID:
        description: "Production tenant ID."
        required: true
      AZURE_SUBSCRIPTION_ID:
        description: "Production subscription ID."
        required: true

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  recover:
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: foundry-production-recovery
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      MANIFEST_BASE64: ${{ inputs.MANIFEST_BASE64 }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      EXPECTED_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      EXPECTED_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate approved scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($Env:MANIFEST_BASE64))
          $scope = $manifest | ConvertFrom-Json
          if ($scope.subscriptionId -ne $Env:AZURE_SUBSCRIPTION_ID -or
              $scope.environmentName -ne $Env:EXPECTED_ENV_NAME -or
              $scope.resourceGroupName -ne $Env:EXPECTED_RESOURCE_GROUP -or
              $scope.repository -ne $Env:GITHUB_REPOSITORY -or
              [string]::IsNullOrWhiteSpace($scope.cleanupAutomationId)) {
            throw 'The approved manifest does not match this Production environment or has no cleanup registration.'
          }
          $manifest | Set-Content -LiteralPath recovery-manifest.json -Encoding utf8NoBOM
          .\scripts\Invoke-ProductionWebAppRecovery.ps1 -ManifestPath (Join-Path $PWD 'recovery-manifest.json') -Mode Preflight -WhatIf
      - name: Authenticate Azure CLI with OIDC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $oidc = Invoke-RestMethod -Uri "$Env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" -Headers @{Authorization="Bearer $Env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"}
            az login --service-principal --username $Env:AZURE_CLIENT_ID --tenant $Env:AZURE_TENANT_ID --federated-token $oidc.value --output none
            if ($LASTEXITCODE -ne 0) { throw 'Production OIDC login failed.' }
          } finally {
            Remove-Variable oidc -Force -ErrorAction SilentlyContinue
          }
      - name: Run approved compute-only recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scope = Get-Content recovery-manifest.json -Raw | ConvertFrom-Json
          .\scripts\Invoke-ProductionWebAppRecovery.ps1 -ManifestPath (Join-Path $PWD 'recovery-manifest.json') -Mode Run -CleanupAutomationId $scope.cleanupAutomationId -Confirm:$false
      - name: Verify attempt-owned compute cleanup
        if: always()
        shell: pwsh
        run: |
          if (Test-Path recovery-manifest.json) {
            $scope = Get-Content recovery-manifest.json -Raw | ConvertFrom-Json
            if ($scope.computeStartedAt) {
              .\scripts\Invoke-ProductionWebAppRecovery.ps1 -ManifestPath (Join-Path $PWD 'recovery-manifest.json') -Mode CleanupCompute -Confirm:$false
            }
          }
      - name: Preserve sanitized recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-recovery-evidence
          path: recovery-manifest.json
